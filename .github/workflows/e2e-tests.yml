name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # =============================================================================
  # BUILD, LINT, AND UNIT TESTS
  # =============================================================================
  ci:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build:local

      - name: Unit Tests with Coverage
        run: npm run test
        # Coverage thresholds (90% statements/lines/functions, 80% branches)
        # are enforced by vitest.config.ts - test will fail if not met

  # =============================================================================
  # E2E TESTS (Local Infrastructure)
  # =============================================================================
  # Runs against a local dev server with Docker services.
  # Only runs after CI job passes.
  # =============================================================================
  e2e:
    name: E2E Tests
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rc_track_rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rc_track_rental
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss --skip-generate

      - name: Seed test data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rc_track_rental
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'test@example.com' }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'testpassword123' }}
        run: npx tsx scripts/e2e-seed.ts

      - name: Run E2E tests
        env:
          # Server runtime environment variables (needed by Playwright's webServer)
          BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rc_track_rental
          NEXTAUTH_SECRET: test-secret-for-ci-environment
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # Stripe configuration (code uses STRIPE_SECRET_KEY, not STRIPE_API_KEY)
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          # Mock services
          USE_STRIPE_MOCK: 'true'
          USE_GOOGLE_MAPS_MOCK: 'true'
          USE_EMAIL_MOCK: 'true'
          # Test user credentials
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'test@example.com' }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'testpassword123' }}
          TEST_STRIPE_CARD_NUMBER: '4242424242424242'
          TEST_STRIPE_CARD_EXPIRY: '12/34'
          TEST_STRIPE_CARD_CVC: '123'
          TEST_STRIPE_CARD_ZIP: '90001'
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/
          retention-days: 7
